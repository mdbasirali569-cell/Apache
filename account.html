<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apache Shop - Account</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.auth-mode{display:flex;gap:10px;margin:18px 0}.auth-mode button{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff;font-weight:700;cursor:pointer}.auth-mode button.active{background:#111;color:#fff}.auth-mode button:disabled{opacity:.6}.auth-message{min-height:22px}.register-form{display:none}
</style>
</head>
<body>
<div class="auth-container" id="authPanel">
<div class="avatar-container"><i class="fa-solid fa-bag-shopping"></i></div>
<h2 class="auth-title">Apache Shop</h2>
<p class="auth-subtitle" id="authSubtitle">Sign in to continue to your account</p>
<div class="auth-mode"><button type="button" id="loginMode" class="active">Login</button><button type="button" id="registerMode">Create Account</button></div>

<form id="loginForm">
<div class="input-group"><label>Email</label><input type="email" id="loginEmail" placeholder="name@example.com" autocomplete="email" required></div>
<div class="input-group"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required><i class="fa-regular fa-eye password-toggle" id="togglePassword"></i></div>
<div class="auth-options"><label><input type="checkbox" id="rememberMe"> Remember me</label><a href="#" id="forgotPassword">Forgot password?</a></div>
<button type="submit" class="auth-btn" id="loginBtn">Sign in</button>
</form>

<form id="registerForm" class="register-form">
<div class="input-group"><label>Email</label><input type="email" id="registerEmail" placeholder="name@example.com" autocomplete="email"></div>
<div class="input-group"><label>Password</label><input type="password" id="registerPassword" placeholder="At least 6 characters" autocomplete="new-password"></div>
<div class="input-group"><label>Confirm Password</label><input type="password" id="registerConfirm" placeholder="Repeat your password" autocomplete="new-password"></div>
<button type="submit" class="auth-btn" id="registerBtn">Create Account</button>
</form>

<div class="divider">or continue with</div>
<div class="social-buttons"><button id="googleLoginBtn" class="social-btn" type="button"><i class="fa-brands fa-google"></i> Continue with Google</button></div>
<p id="authMessage" class="auth-subtitle auth-message" role="alert"></p>
</div>

<div class="auth-container" id="userPanel" style="display:none">
<div class="avatar-container"><i class="fa-solid fa-user"></i></div><h2 class="auth-title" id="userName">Welcome</h2><p class="auth-subtitle" id="userEmail"></p>
<div id="ordersPanel" class="orders-panel"><h3>My Orders</h3><div id="ordersList"><p class="auth-subtitle">Loading orders...</p></div></div>
<button class="auth-btn" id="logoutBtn" type="button">Sign out</button>
</div>

<div class="nav-container-bottom"><nav class="liquid-nav">
<a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
<a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a>
<a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart <small id="cartCount">0</small></span></a>
<a href="account.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Account</span></a>
</nav></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,GoogleAuthProvider,signInWithPopup,signOut,setPersistence,browserLocalPersistence,browserSessionPersistence}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDocs,collection,query,where}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCDm9zVG4V1hzVUHt7o6RK9NzWzVblh5Hs",authDomain:"apache-shop.firebaseapp.com",projectId:"apache-shop",storageBucket:"apache-shop.firebasestorage.app",messagingSenderId:"40961890999",appId:"1:40961890999:web:5db3dc1001c1e81a97cb32"});
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),msg=t=>$("authMessage").textContent=t||"";
const errorText=x=>({"auth/invalid-credential":"Incorrect email or password.","auth/invalid-login-credentials":"Incorrect email or password.","auth/user-not-found":"No account was found with this email.","auth/wrong-password":"Incorrect password.","auth/invalid-email":"Please enter a valid email address.","auth/email-already-in-use":"An account already exists with this email. Please Login.","auth/weak-password":"Password must be at least 6 characters.","auth/operation-not-allowed":"Email/password sign-in is disabled in Firebase Authentication.","auth/popup-closed-by-user":"Google sign-in was cancelled.","auth/popup-blocked":"Your browser blocked the Google sign-in popup.","auth/unauthorized-domain":"This website domain is not authorized in Firebase Authentication.","auth/network-request-failed":"Network error. Check your internet connection.","auth/too-many-requests":"Too many attempts. Please wait and try again."}[x?.code]||x?.message||"Something went wrong. Please try again.");
const persist=()=>setPersistence(auth,$("rememberMe")?.checked?browserLocalPersistence:browserSessionPersistence);
function escapeHtml(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function mode(register){$("loginMode").classList.toggle("active",!register);$("registerMode").classList.toggle("active",register);$("loginForm").style.display=register?"none":"block";$("registerForm").style.display=register?"block":"none";$("authSubtitle").textContent=register?"Create your Apache Shop account":"Sign in to continue to your account";msg("");}
$("loginMode").onclick=()=>mode(false);$("registerMode").onclick=()=>mode(true);
$("togglePassword").onclick=()=>{const p=$("loginPassword");p.type=p.type==="password"?"text":"password"};
$("loginForm").onsubmit=async e=>{e.preventDefault();msg("");const b=$("loginBtn");b.disabled=true;b.textContent="Signing in...";try{await persist();await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPassword").value)}catch(x){msg(errorText(x));b.disabled=false;b.textContent="Sign in"}};
$("registerForm").onsubmit=async e=>{e.preventDefault();msg("");const email=$("registerEmail").value.trim(),p=$("registerPassword").value,c=$("registerConfirm").value;if(p.length<6){msg("Password must be at least 6 characters.");return}if(p!==c){msg("Passwords do not match.");return}const b=$("registerBtn");b.disabled=true;b.textContent="Creating account...";try{await setPersistence(auth,browserLocalPersistence);await createUserWithEmailAndPassword(auth,email,p)}catch(x){msg(errorText(x));b.disabled=false;b.textContent="Create Account"}};
$("forgotPassword").onclick=async e=>{e.preventDefault();msg("");const email=$("loginEmail").value.trim();if(!email){msg("Enter your email first.");return}try{await sendPasswordResetEmail(auth,email);msg("Password reset email sent. Check your inbox.")}catch(x){msg(errorText(x))}};
$("googleLoginBtn").onclick=async()=>{msg("");const b=$("googleLoginBtn");b.disabled=true;b.innerHTML='<i class="fa-brands fa-google"></i> Signing in...';try{await persist();await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){msg(errorText(x));b.disabled=false;b.innerHTML='<i class="fa-brands fa-google"></i> Continue with Google'}};
onAuthStateChanged(auth,async u=>{$("authPanel").style.display=u?"none":"block";$('userPanel').style.display=u?"block":"none";if(!u)return;$("userName").textContent=u.displayName||"Welcome";$("userEmail").textContent=u.email||"";try{await setDoc(doc(db,"users",u.uid),{uid:u.uid,email:u.email||"",displayName:u.displayName||"",updatedAt:new Date()},{merge:true})}catch(e){console.error(e)}loadOrders(u.uid)});
async function loadOrders(uid){const list=$("ordersList");try{const snap=await getDocs(query(collection(db,"orders"),where("uid","==",uid)));const orders=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.timestamp?.seconds||0)-(a.timestamp?.seconds||0));if(!orders.length){list.innerHTML='<p class="auth-subtitle">No orders yet.</p>';return}list.innerHTML=orders.map(o=>{const date=o.timestamp?.toDate?o.timestamp.toDate().toLocaleDateString():o.timestamp?.seconds?new Date(o.timestamp.seconds*1000).toLocaleDateString():"Pending";const items=(o.items||[]).map(i=>escapeHtml(i.name)+" × "+Number(i.quantity||0)).join(", ");return '<div class="order-card"><div><strong>Order #'+escapeHtml(o.id.slice(-8).toUpperCase())+'</strong><span>'+date+'</span></div><p>'+items+'</p><div><b>$'+Number(o.total||0).toFixed(2)+'</b><span class="order-status">'+escapeHtml(o.status||"pending")+'</span></div></div>'}).join("")}catch(e){console.error(e);list.innerHTML='<p class="auth-subtitle">Signed in successfully. Orders could not be loaded right now.</p>'}}
$("logoutBtn")?.addEventListener("click",()=>signOut(auth));
</script><script src="script.js"></script>
</body></html>
