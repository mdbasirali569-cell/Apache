<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apache Shop - Account</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="auth-container" id="authPanel">
  <div class="avatar-container"><i class="fa-solid fa-bag-shopping"></i></div>
  <h2 class="auth-title">Apache Shop</h2>
  <p class="auth-subtitle">Sign in to continue to your account</p>
  <form id="loginForm">
    <div class="input-group"><label>Email</label><input type="email" id="loginEmail" placeholder="name@example.com" autocomplete="email" required></div>
    <div class="input-group"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required><i class="fa-regular fa-eye password-toggle" id="togglePassword"></i></div>
    <div class="auth-options"><label><input type="checkbox" id="rememberMe"> Remember me</label><a href="#" id="forgotPassword">Forgot password?</a></div>
    <button type="submit" class="auth-btn" id="loginBtn">Sign in</button>
  </form>
  <div class="divider">or continue with</div>
  <div class="social-buttons"><button id="googleLoginBtn" class="social-btn" type="button"><i class="fa-brands fa-google"></i> Google</button></div>
  <div class="register-link">New to Apache Shop? <a href="#" id="createAccount">Create account</a></div>
  <p id="authMessage" class="auth-subtitle" role="alert"></p>
</div>

<div class="auth-container" id="userPanel" style="display:none">
  <div class="avatar-container"><i class="fa-solid fa-user"></i></div>
  <h2 class="auth-title" id="userName">Welcome</h2>
  <p class="auth-subtitle" id="userEmail"></p>
  <div id="ordersPanel" class="orders-panel"><h3>My Orders</h3><div id="ordersList"><p class="auth-subtitle">Loading orders...</p></div></div>
  <button class="auth-btn" id="logoutBtn" type="button">Sign out</button>
</div>

<div class="nav-container-bottom"><nav class="liquid-nav">
  <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a>
  <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart <small id="cartCount">0</small></span></a>
  <a href="account.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Account</span></a>
</nav></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,GoogleAuthProvider,signInWithPopup,signOut,setPersistence,browserLocalPersistence,browserSessionPersistence } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore,doc,setDoc,getDocs,collection,query,where } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCDm9zVG4V1hzVUHt7o6RK9NzWzVblh5Hs",authDomain:"apache-shop.firebaseapp.com",projectId:"apache-shop",storageBucket:"apache-shop.firebasestorage.app",messagingSenderId:"40961890999",appId:"1:40961890999:web:5db3dc1001c1e81a97cb32"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const msg=t=>{$("authMessage").textContent=t||""};
const authError=x=>({"auth/invalid-credential":"Incorrect email or password.","auth/invalid-login-credentials":"Incorrect email or password.","auth/user-not-found":"No account was found with this email.","auth/wrong-password":"Incorrect password.","auth/invalid-email":"Please enter a valid email address.","auth/email-already-in-use":"An account already exists with this email.","auth/weak-password":"Password must be at least 6 characters.","auth/operation-not-allowed":"Email/password sign-in is disabled in Firebase Authentication.","auth/popup-closed-by-user":"Google sign-in was cancelled.","auth/popup-blocked":"Your browser blocked the Google sign-in popup.","auth/unauthorized-domain":"This website domain is not authorized in Firebase Authentication.","auth/network-request-failed":"Network error. Check your internet connection.","auth/too-many-requests":"Too many attempts. Please wait and try again."}[x?.code]||x?.message||"Sign in failed. Please try again.");
const persist=()=>setPersistence(auth,$("rememberMe").checked?browserLocalPersistence:browserSessionPersistence);
function escapeHtml(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function setBusy(id,busy,text){const b=$(id);if(!b)return;b.disabled=busy;b.textContent=text||"Sign in";}

$("togglePassword").onclick=()=>{const p=$("loginPassword");p.type=p.type==="password"?"text":"password"};

$("loginForm").onsubmit=async e=>{
 e.preventDefault();msg("");setBusy("loginBtn",true,"Signing in...");
 try{await persist();await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPassword").value);}
 catch(x){msg(authError(x));setBusy("loginBtn",false,"Sign in");}
};

$("createAccount").onclick=async e=>{
 e.preventDefault();msg("");setBusy("loginBtn",true,"Creating account...");
 try{await persist();await createUserWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPassword").value);}
 catch(x){msg(authError(x));setBusy("loginBtn",false,"Sign in");}
};

$("forgotPassword").onclick=async e=>{
 e.preventDefault();msg("");
 try{const email=$("loginEmail").value.trim();if(!email){msg("Enter your email first.");return}await sendPasswordResetEmail(auth,email);msg("Password reset email sent. Check your inbox.");}
 catch(x){msg(authError(x));}
};

$("googleLoginBtn").onclick=async()=>{
 msg("");const b=$("googleLoginBtn");b.disabled=true;b.innerHTML='<i class="fa-brands fa-google"></i> Signing in...';
 try{await persist();await signInWithPopup(auth,new GoogleAuthProvider());}
 catch(x){msg(authError(x));b.disabled=false;b.innerHTML='<i class="fa-brands fa-google"></i> Google';}
};

onAuthStateChanged(auth,async u=>{
 $("authPanel").style.display=u?"none":"block";
 $("userPanel").style.display=u?"block":"none";
 if(!u){setBusy("loginBtn",false,"Sign in");return;}
 $("userName").textContent=u.displayName||"Welcome";
 $("userEmail").textContent=u.email||"";
 try{
   await setDoc(doc(db,"users",u.uid),{uid:u.uid,email:u.email||"",displayName:u.displayName||"",updatedAt:new Date()},{merge:true});
 }catch(err){console.error("Profile save failed:",err);}
 await loadOrders(u.uid);
});

async function loadOrders(uid){
 const list=$("ordersList");
 try{
   const snap=await getDocs(query(collection(db,"orders"),where("uid","==",uid)));
   const orders=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.timestamp?.seconds||0)-(a.timestamp?.seconds||0));
   if(!orders.length){list.innerHTML='<p class="auth-subtitle">No orders yet.</p>';return;}
   list.innerHTML=orders.map(o=>{const date=o.timestamp?.toDate?o.timestamp.toDate().toLocaleDateString():o.timestamp?.seconds?new Date(o.timestamp.seconds*1000).toLocaleDateString():"Pending";const items=(o.items||[]).map(i=>escapeHtml(i.name)+" × "+Number(i.quantity||0)).join(", ");return '<div class="order-card"><div><strong>Order #'+escapeHtml(o.id.slice(-8).toUpperCase())+'</strong><span>'+date+'</span></div><p>'+items+'</p><div><b>$'+Number(o.total||0).toFixed(2)+'</b><span class="order-status">'+escapeHtml(o.status||"pending")+'</span></div></div>';}).join("");
 }catch(err){console.error("Order load failed:",err);list.innerHTML='<p class="auth-subtitle">Signed in successfully. Orders could not be loaded right now.</p>';}
}

$("logoutBtn")?.addEventListener("click",async()=>{await signOut(auth);msg("");});
</script>
<script src="script.js"></script>
</body>
</html>
