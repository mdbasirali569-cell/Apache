<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Shop - Account</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>

    <div class="auth-container">
        <div class="avatar-container">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <h2 class="auth-title">Apache Shop</h2>
        <p class="auth-subtitle">Sign in to continue to your account</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Email / Username</label>
                <input type="email" id="loginEmail" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
                <i class="fa-regular fa-eye password-toggle" id="togglePassword"></i>
            </div>
            
            <div class="auth-options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="auth-btn">Sign in</button>
        </form>

        <div class="divider">or continue with</div>

        <div class="social-buttons">
            <button id="googleLoginBtn" class="social-btn">
                <i class="fa-brands fa-google"></i> Google
            </button>
            <button class="social-btn">
                <i class="fa-brands fa-apple"></i> Apple
            </button>
        </div>

        <div class="register-link">
            New to Apache Shop? <a href="#">Create account</a>
        </div>
    </div>

    <div class="nav-container-bottom">
        <nav class="liquid-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a>
            <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a>
            <a href="account.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Account</span></a>
        </nav>
    </div>

    <script>
        // Password visibility toggle feature
        const togglePassword = document.getElementById('togglePassword');
        const loginPassword = document.getElementById('loginPassword');

        togglePassword.addEventListener('click', function () {
            const type = loginPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            loginPassword.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
