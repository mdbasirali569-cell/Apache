<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Shop - Account</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 90px;
        }
        .auth-container {
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .auth-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .auth-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 13px;
            color: #cbd5e1;
        }
        .input-group input {
            padding: 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #3b82f6;
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .auth-btn:hover {
            background: #e2e8f0;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #64748b;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }
        
        .social-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.3s;
        }
        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .profile-card {
            text-align: center;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            border: 2px solid #3b82f6;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Login View -->
        <div id="loginView">
            <h2 class="auth-title">Welcome back</h2>
            <p class="auth-subtitle">Sign in to continue to Apache Shop</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="name@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Sign in</button>
            </form>

            <div class="divider">or continue with</div>

            <button id="googleLoginBtn" class="social-btn">
                <i class="fa-brands fa-google"></i> Google
            </button>
        </div>

        <!-- Profile View (Shown after login) -->
        <div id="profileView" class="profile-card" style="display: none;">
            <img id="userAvatar" src="" alt="Avatar" class="profile-avatar">
            <h2 class="auth-title" id="userName">User Name</h2>
            <p class="auth-subtitle" id="userEmail">user@email.com</p>
            <button id="logoutBtn" class="auth-btn" style="background: #ef4444; color: #fff;">Sign Out</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-container-bottom">
        <nav class="liquid-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a>
            <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a>
            <a href="account.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Account</span></a>
        </nav>
    </div>

    <!-- Firebase Authentication Logic -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCDm9zVG4V1hzVUHt7o6RK9NzWzVblh5Hs",
        authDomain: "apache-shop.firebaseapp.com",
        projectId: "apache-shop",
        storageBucket: "apache-shop.firebasestorage.app",
        messagingSenderId: "40961890999",
        appId: "1:40961890999:web:5db3dc1001c1e81a97cb32",
        measurementId: "G-ZLH2D7NN4D"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      const loginView = document.getElementById('loginView');
      const profileView = document.getElementById('profileView');

      // Google Sign-In Button
      document.getElementById('googleLoginBtn').addEventListener('click', async () => {
          try {
              await signInWithPopup(auth, provider);
              alert("Successfully signed in with Google!");
          } catch (error) {
              console.error("Auth error:", error);
              alert("Sign in failed: " + error.message);
          }
      });

      // Email/Password Sign-In
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('loginEmail').value;
          const password = document.getElementById('loginPassword').value;
          try {
              await signInWithEmailAndPassword(auth, email, password);
              alert("Successfully signed in!");
          } catch (error) {
              console.error("Login error:", error);
              alert("Login failed: " + error.message);
          }
      });

      // Sign Out Button
      document.getElementById('logoutBtn').addEventListener('click', async () => {
          try {
              await signOut(auth);
              alert("Signed out successfully!");
          } catch (error) {
              console.error("Signout error:", error);
          }
      });

      // Monitor Auth State (Toggle Views)
      onAuthStateChanged(auth, (user) => {
          if (user) {
              loginView.style.display = 'none';
              profileView.style.display = 'block';
              document.getElementById('userName').innerText = user.displayName || "Apache User";
              document.getElementById('userEmail').innerText = user.email;
              document.getElementById('userAvatar').src = user.photoURL || "https://via.placeholder.com/80";
          } else {
              loginView.style.display = 'block';
              profileView.style.display = 'none';
          }
      });
    </script>
</body>
</html>
