<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Shop - Account</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 110px;
            min-height: 100vh;
        }
        .auth-container {
            width: 100%;
            max-width: 410px;
            margin: 35px auto 20px auto;
            padding: 35px 28px;
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            text-align: center;
        }
        /* Shopping Bag Icon Avatar Styling */
        .avatar-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px auto;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #38bdf8;
            border: 2px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.2);
            animation: floatAvatar 4s ease-in-out infinite;
        }
        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .auth-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .auth-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 6px;
            position: relative;
        }
        .input-group label {
            font-size: 12px;
            font-weight: 500;
            color: #cbd5e1;
            margin-left: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(11, 15, 25, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #3b82f6;
            background: rgba(11, 15, 25, 0.95);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 40px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 15px;
        }
        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #94a3b8;
            margin: 18px 0 22px 0;
        }
        .auth-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .auth-options a {
            color: #60a5fa;
            text-decoration: none;
            transition: color 0.2s;
        }
        .auth-options a:hover {
            color: #93c5fd;
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            color: #0f172a;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        .auth-btn:hover {
            background: linear-gradient(135deg, #f8fafc, #cbd5e1);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(255, 255, 255, 0.25);
        }
        .auth-btn:active {
            transform: scale(0.98);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0;
            color: #64748b;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }
        
        .social-buttons {
            display: flex;
            gap: 12px;
        }
        .social-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .social-btn:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .register-link {
            margin-top: 22px;
            font-size: 13px;
            color: #94a3b8;
        }
        .register-link a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="avatar-container">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <h2 class="auth-title">Apache Shop</h2>
        <p class="auth-subtitle">Sign in to continue to your account</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Email / Username</label>
                <input type="email" id="loginEmail" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
                <i class="fa-regular fa-eye password-toggle" id="togglePassword"></i>
            </div>
            
            <div class="auth-options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="auth-btn">Sign in</button>
        </form>

        <div class="divider">or continue with</div>

        <div class="social-buttons">
            <button id="googleLoginBtn" class="social-btn">
                <i class="fa-brands fa-google"></i> Google
            </button>
            <button class="social-btn">
                <i class="fa-brands fa-apple"></i> Apple
            </button>
        </div>

        <div class="register-link">
            New to Apache Shop? <a href="#">Create account</a>
        </div>
    </div>

    <div class="nav-container-bottom">
        <nav class="liquid-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a>
            <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a>
            <a href="account.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Account</span></a>
        </nav>
    </div>

    <script>
        // Password visibility toggle feature
        const togglePassword = document.getElementById('togglePassword');
        const loginPassword = document.getElementById('loginPassword');

        togglePassword.addEventListener('click', function () {
            const type = loginPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            loginPassword.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
