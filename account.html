<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Shop - Account</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            padding: 30px;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            box-sizing: border-box;
            text-align: center;
        }
        /* Husky / Avatar Animation Style */
        .avatar-container {
            width: 85px;
            height: 85px;
            margin: 0 auto 15px auto;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .auth-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .auth-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
        }
        .input-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 6px;
        }
        .input-group label {
            font-size: 13px;
            color: #cbd5e1;
        }
        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #3b82f6;
        }
        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .auth-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .auth-options a {
            color: #60a5fa;
            text-decoration: none;
        }
        .auth-btn {
            width: 100%;
            padding: 13px;
            background: #ffffff;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        .auth-btn:hover {
            background: #e2e8f0;
        }
        .auth-btn:active {
            transform: scale(0.98);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #64748b;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }
        
        .social-buttons {
            display: flex;
            gap: 10px;
        }
        .social-btn {
            flex: 1;
            padding: 11px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s;
        }
        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .register-link {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
        .register-link a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="avatar-container">
            🐶
        </div>
        <h2 class="auth-title">Apache Shop</h2>
        <p class="auth-subtitle">Sign in to continue to your account</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Email / Username</label>
                <input type="email" id="loginEmail" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            
            <div class="auth-options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="auth-btn">Sign in</button>
        </form>

        <div class="divider">or continue with</div>

        <div class="social-buttons">
            <button id="googleLoginBtn" class="social-btn">
                <i class="fa-brands fa-google"></i> Google
            </button>
            <button class="social-btn">
                <i class="fa-brands fa-apple"></i> Apple
            </button>
        </div>

        <div class="register-link">
            New to Apache Shop? <a href="#">Create account</a>
        </div>
    </div>

    <div class="nav-container-bottom">
        <nav class="liquid-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a>
            <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a>
            <a href="account.html" class="nav-item active"><i class="fa-solid fa-user"><span>Account</span></a>
        </nav>
    </div>

</body>
</html>
