<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Shop - Account</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="account-body">

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <i class="fa-solid fa-moon"></i> LUNARA
            </div>
            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to continue to lunara</p>

            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="sol@lunara.app" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordInput" placeholder="••••••••" required>
                        <i class="fa-solid fa-eye-slash" id="togglePassword" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>

                <button type="submit" class="sign-in-btn">Sign in</button>
            </form>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-buttons">
                <button class="social-btn"><i class="fa-brands fa-google"></i> Google</button>
                <button class="social-btn"><i class="fa-brands fa-apple"></i> Apple</button>
            </div>

            <p class="create-account">New to Lunara? <a href="#">Create account</a></p>
        </div>
    </div>

    <div class="nav-container-bottom">
        <nav class="liquid-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a>
            <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span> <span id="cartCount" class="badge">0</span></a>
            <a href="account.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Account</span></a>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
