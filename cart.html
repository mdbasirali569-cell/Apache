<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apache Shop - Cart</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{background:#0f172a;color:#fff;font-family:Segoe UI,sans-serif;margin:0;padding-bottom:110px}.cart-header{padding:20px;background:#0b0f19;text-align:center;font-size:22px;font-weight:700}.cart-container{max-width:700px;margin:20px auto;padding:0 20px}.cart-card,.cart-summary{background:#111827bf;backdrop-filter:blur(20px);border:1px solid #ffffff1a;border-radius:24px;padding:20px;margin-bottom:20px}.cart-item{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff14}.item-info{display:flex;align-items:center;gap:12px}.item-info img{width:58px;height:58px;object-fit:cover;border-radius:12px}.item-info h4{margin:0 0 5px}.item-info p{margin:0;color:#94a3b8;font-size:12px}.quantity-controls{display:flex;align-items:center;gap:8px}.quantity-controls button{width:30px;height:30px;border:0;border-radius:9px}.item-price{font-weight:700;color:#38bdf8}.remove-item{border:0;background:transparent;color:#f87171}.total-price{text-align:center;font-size:18px;font-weight:700}.total-price span{color:#38bdf8}.checkout-btn{display:block;background:#ef4444;color:#fff;text-decoration:none;text-align:center;padding:14px;border-radius:16px;margin-top:16px;font-weight:600}.empty-cart{text-align:center;padding:35px 10px;color:#cbd5e1}.empty-cart i{font-size:40px;color:#38bdf8}.empty-cart a{display:inline-block;margin-top:12px;color:#fff;background:#1e293b;padding:10px 16px;border-radius:12px;text-decoration:none}@media(max-width:600px){.cart-item{grid-template-columns:1fr auto}.item-price{grid-column:1}.remove-item{grid-column:2;grid-row:2}}</style></head><body><div class="cart-header">Your Shopping Cart <small id="cartCount">0</small></div><div class="cart-container"><div class="cart-card"><div id="cartItemsContainer"></div></div><div class="cart-summary"><div id="cartTotal" class="total-price">Total Price: <span>$0.00</span></div><a class="checkout-btn" href="checkout.html">Proceed to Checkout</a></div></div><div class="nav-container-bottom"><nav class="liquid-nav"><a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a><a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a><a href="cart.html" class="nav-item active"><i class="fa-solid fa-cart-shopping"></i><span>Cart <small id="cartCount">0</small></span></a><a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a></nav></div><script src="script.js"></script></body></html>
