<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Shop - Cart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 110px;
            min-height: 100vh;
        }
        /* Top Header */
        .cart-header {
            padding: 20px;
            background: #0b0f19;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Cart Container */
        .cart-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .cart-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .item-info h4 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #ffffff;
        }
        .item-info p {
            margin: 0;
            font-size: 13px;
            color: #94a3b8;
        }
        .item-price {
            font-size: 16px;
            font-weight: 600;
            color: #38bdf8;
        }
        /* Cart Summary Box */
        .cart-summary {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        .total-price {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .total-price span {
            color: #38bdf8;
        }
        .checkout-btn {
            background: #ef4444;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
            transition: transform 0.2s;
        }
        .checkout-btn:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="cart-header">Your Shopping Cart</div>

    <div class="cart-container">
        <!-- Cart Items List -->
        <div class="cart-card">
            <div class="cart-item">
                <div class="item-info">
                    <h4>Wireless Headphones</h4>
                    <p>$99.00 x 1</p>
                </div>
                <div class="item-price">$99.00</div>
            </div>
            <div class="cart-item">
                <div class="item-info">
                    <h4>Minimalist Watch</h4>
                    <p>$149.00 x 2</p>
                </div>
                <div class="item-price">$298.00</div>
            </div>
        </div>

        <!-- Summary & Checkout -->
        <div class="cart-summary">
            <div class="total-price">Total Price: <span>$397.00</span></div>
            <button class="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-container-bottom">
        <nav class="liquid-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a>
            <a href="cart.html" class="nav-item active"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a>
            <a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a>
        </nav>
    </div>

</body>
</html>
