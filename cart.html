<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Shop - Cart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <h2 class="section-title">Your Shopping Cart</h2>
        
        <div id="cartItemsContainer" style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); padding: 25px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <p style="text-align: center; color: #555;">Your cart is empty.</p>
        </div>

        <!-- Total Price & Checkout Button Area -->
        <div id="cartFooter" style="text-align: right; max-width: 600px; margin: 0 auto; display: none;">
            <div id="cartTotal" style="font-size: 18px; font-weight: bold; margin-bottom: 15px;"></div>
            <a href="checkout.html" class="btn" style="display: inline-block; padding: 12px 30px; text-decoration: none; border-radius: 8px; font-size: 16px;">Proceed to Checkout</a>
        </div>
    </div>

    <!-- Bottom Liquid Glass Navigation Bar -->
    <div class="nav-container-bottom">
        <nav class="liquid-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a>
            <a href="cart.html" class="nav-item active"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span> <span id="cartCount" class="badge">0</span></a>
            <a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a>
        </nav>
    </div>

    <script src="script.js"></script>
    <script>
        // Additional script to show/hide checkout button based on cart items
        document.addEventListener("DOMContentLoaded", () => {
            let cart = JSON.parse(localStorage.getItem('apacheCart')) || [];
            let cartFooter = document.getElementById('cartFooter');
            if (cart.length > 0 && cartFooter) {
                cartFooter.style.display = "block";
            }
        });
    </script>
</body>
</html>
