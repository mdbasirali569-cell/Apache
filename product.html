<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Apache Signature T-Shirt product details."><title>Apache Shop - Product</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>.apache-product{max-width:1100px;margin:25px auto 110px;padding:16px}.apache-product-card{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:20px;overflow:hidden}.apache-main-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px;display:block}.apache-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.apache-thumb{border:2px solid transparent;border-radius:10px;padding:0;background:transparent;overflow:hidden}.apache-thumb.active{border-color:#4bbcff}.apache-thumb img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.apache-info{padding:18px 8px}.apache-info .kicker{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:800;opacity:.6}.apache-info h1{font-size:clamp(30px,5vw,48px);margin:8px 0}.apache-price{font-size:30px;font-weight:900;margin:18px 0}.apache-price del{font-size:17px;opacity:.5;margin-left:8px}.apache-info p{line-height:1.7;opacity:.75}.apache-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.apache-actions button{border:0;border-radius:13px;padding:14px 20px;font-weight:800;cursor:pointer}.apache-add{background:#fff;color:#111}.apache-back{background:rgba(255,255,255,.1);color:inherit;text-decoration:none;padding:14px 20px;border-radius:13px;font-weight:800}@media(max-width:750px){.apache-product-card{grid-template-columns:1fr}.apache-info{padding:8px 2px}}</style></head><body><div class="search-container"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="search" placeholder="Search products..." autocomplete="off"></div></div><main id="productDetail"></main><div id="toast-container"><i class="fa-solid fa-bag-shopping"></i> <span id="toast-message"></span></div><div class="nav-container-bottom"><nav class="liquid-nav"><a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a><a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a><a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart <small id="cartCount">0</small></span></a><a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a></nav></div><script src="script.js"></script><script>document.addEventListener('DOMContentLoaded',function(){if(new URLSearchParams(location.search).get('id')!=='apache-tshirt')return;var imgs=['https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1583743814966-8936f37f384f?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=1000&q=85'];var root=document.getElementById('productDetail');root.innerHTML='<section class="apache-product"><div class="apache-product-card"><div><img id="apacheMainImage" class="apache-main-img" src="'+imgs[0]+'" alt="Apache Signature T-Shirt"><div class="apache-thumbs">'+imgs.map(function(x,i){return '<button class="apache-thumb '+(i===0?'active':'')+'" onclick="apacheSelect(\''+x+'\',this)"><img src="'+x+'" alt="T-Shirt view '+(i+1)+'"></button>'}).join('')+'</div></div><div class="apache-info"><div class="kicker">Apache Collection</div><h1>Apache Signature T-Shirt</h1><div class="rating"><span>★★★★★</span> 5.0</div><div class="apache-price">$39.00 <del>$49.00</del></div><p>Our featured Apache Signature T-Shirt. Explore the front, back, sleeve details and full product views before adding it to your cart.</p><p><strong>In stock</strong> • 30 available</p><div class="apache-actions"><button class="apache-add" onclick="addToCart('apache-tshirt')"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button><a class="apache-back" href="index.html">Back to Home</a></div></div></div></section>'});function apacheSelect(src,btn){document.getElementById('apacheMainImage').src=src;document.querySelectorAll('.apache-thumb').forEach(function(x){x.classList.remove('active')});btn.classList.add('active')};</script></body></html>
