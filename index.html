<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Shop - Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Liquid Glass Navigation Bar -->
    <div class="nav-container">
        <nav class="liquid-nav">
            <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i> Home</a>
            <a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i> Category</a>
            <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
            <a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i> Account</a>
        </nav>
    </div>

    <!-- Liquid Glass Search Bar Section -->
    <div class="search-container">
        <div class="liquid-search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search products, categories...">
            <button class="search-btn">Search</button>
        </div>
    </div>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome To Apache Shop</h1>
        <p>Discover amazing products with liquid glass design and seamless shopping experience.</p>
        <a href="shop.html" class="btn">Shop Now</a>
    </section>

    <footer>
        <p>&copy; 2026 Apache Shop. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
