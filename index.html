<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apache Shop - Home</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{background:#0f172a;color:#fff;font-family:Segoe UI,sans-serif;margin:0;padding-bottom:110px}.search-container{padding:15px 20px;background:#0b0f19;position:sticky;top:0;z-index:100}.search-box{display:flex;gap:12px;align-items:center;background:#ffffff12;border:1px solid #ffffff26;border-radius:30px;padding:10px 18px}.search-box input{background:transparent;border:0;outline:0;color:#fff;width:100%}.hero-banner{margin:20px;padding:40px 20px;background:linear-gradient(#0009,#0009),url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=800&q=80') center/cover;border-radius:24px;text-align:center}.hero-btn,.add-to-cart-btn{background:#ef4444;color:#fff;border:0;padding:11px 22px;border-radius:14px;font-weight:600;cursor:pointer}.section-title{text-align:center}.products-container{max-width:600px;margin:auto;padding:0 20px}.product-card{background:#fff;color:#0f172a;border-radius:24px;overflow:hidden;margin-bottom:25px;text-align:center;padding-bottom:20px}.product-image{width:100%;height:200px;object-fit:cover}.product-title{font-size:18px;font-weight:700;margin:15px 0 5px}.product-price{color:#ef4444;font-weight:600;margin-bottom:15px}.add-to-cart-btn{background:#1e293b}#toast-container{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:#111827ee;color:#fff;padding:12px 22px;border-radius:16px;z-index:1000;opacity:0;transition:.3s}#toast-container.show{transform:translateX(-50%) translateY(0);opacity:1}</style></head><body><div class="search-container"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="search" placeholder="Search products..." autocomplete="off"></div></div><div class="hero-banner"><h1>Welcome To Apache Shop</h1><p>Discover amazing products with a seamless shopping experience.</p><button class="hero-btn" onclick="location.href='shop.html'">Shop Now</button></div><h2 class="section-title">Featured Products</h2><div class="products-container"><div class="product-card" data-name="Wireless Headphones"><img class="product-image" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" alt="Wireless Headphones"><div class="product-title">Wireless Headphones</div><div class="product-price">$99.00</div><button class="add-to-cart-btn" onclick="addToCart('Wireless Headphones',99)">Add to Cart</button></div><div class="product-card" data-name="Minimalist Watch"><img class="product-image" src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" alt="Minimalist Watch"><div class="product-title">Minimalist Watch</div><div class="product-price">$149.00</div><button class="add-to-cart-btn" onclick="addToCart('Minimalist Watch',149)">Add to Cart</button></div></div><div id="toast-container"><i class="fa-solid fa-bag-shopping"></i> <span id="toast-message"></span></div><div class="nav-container-bottom"><nav class="liquid-nav"><a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a><a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a><a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart <small id="cartCount">0</small></span></a><a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a></nav></div><script src="script.js"></script></body></html>
