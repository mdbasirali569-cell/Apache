<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Apache Shop - Products</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>.canva-showcase{max-width:1100px;margin:28px auto 110px;padding:0 16px}.canva-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.16)}.canva-title{text-align:center;margin:4px 0 6px}.canva-sub{text-align:center;opacity:.72;margin:0 0 18px}.canva-frame{position:relative;width:100%;max-width:760px;margin:auto;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#f5f5f5}.canva-frame iframe{width:100%;height:100%;border:0}.canva-link{display:flex;justify-content:center;margin:16px 0 4px}.canva-link a{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;text-decoration:none;font-weight:700;background:#111;color:#fff}.canva-views{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.canva-view{border-radius:12px;padding:14px 8px;text-align:center;background:rgba(127,127,127,.09);font-size:13px;font-weight:700}.canva-view i{display:block;font-size:20px;margin-bottom:6px}@media(max-width:600px){.canva-views{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="search-container"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="search" placeholder="Search products..." autocomplete="off"></div></div><h2 class="section-title">All Products</h2><div class="products-container" id="shopProducts"></div><section class="canva-showcase" aria-label="Apache T-shirt showcase"><div class="canva-card"><h2 class="canva-title">Apache Signature T-Shirt</h2><p class="canva-sub">Front • Back • Sleeve details • Full product view</p><div class="canva-frame"><iframe loading="lazy" title="Apache T-shirt Canva design" src="https://www.canva.com/design/DAHWXIiU8m0/view?embed" allowfullscreen></iframe></div><div class="canva-views"><div class="canva-view"><i class="fa-solid fa-shirt"></i>Front</div><div class="canva-view"><i class="fa-solid fa-shirt"></i>Back</div><div class="canva-view"><i class="fa-solid fa-hand"></i>Sleeve</div><div class="canva-view"><i class="fa-solid fa-expand"></i>Full View</div></div><div class="canva-link"><a href="https://canva.link/3qhhzt3vuh6k84c" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-pen-ruler"></i> Open Design in Canva</a></div></div></section><div id="toast-container"><i class="fa-solid fa-bag-shopping"></i> <span id="toast-message"></span></div><div class="nav-container-bottom"><nav class="liquid-nav"><a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a><a href="shop.html" class="nav-item active"><i class="fa-solid fa-list"></i><span>Category</span></a><a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart <small id="cartCount">0</small></span></a><a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a></nav></div><script src="script.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const e=document.getElementById("shopProducts");if(e)e.innerHTML=PRODUCTS.map(productCard).join("")})</script></body></html>
