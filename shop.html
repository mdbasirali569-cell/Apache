<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Shop - Category</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 110px;
            min-height: 100vh;
        }
        /* Top Search Bar */
        .search-container {
            padding: 15px 20px;
            background: #0b0f19;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 10px 18px;
            gap: 12px;
        }
        .search-box i {
            color: #94a3b8;
            font-size: 16px;
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
            width: 100%;
        }
        .search-box input::placeholder {
            color: #94a3b8;
        }

        /* Section Title */
        .section-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin: 25px 0 20px 0;
            color: #ffffff;
        }

        /* Category / Products Grid */
        .products-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .product-card {
            background: #ffffff;
            color: #0f172a;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            padding-bottom: 20px;
        }
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-title {
            font-size: 18px;
            font-weight: 700;
            margin: 15px 0 5px 0;
            color: #0f172a;
        }
        .product-price {
            font-size: 16px;
            color: #ef4444;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .add-to-cart-btn {
            background: #1e293b;
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add-to-cart-btn:hover {
            background: #0f172a;
        }

        /* Toast Notification Styling */
        #toast-container {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #f8fafc;
            padding: 12px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }
        #toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        #toast-container i {
            color: #38bdf8;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Top Search Bar -->
    <div class="search-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search categories & products...">
        </div>
    </div>

    <!-- Category Products -->
    <h2 class="section-title">Shop Categories</h2>

    <div class="products-container">
        <!-- Product 1 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" alt="Shoes" class="product-image">
            <div class="product-title">Running Sneakers</div>
            <div class="product-price">$120.00</div>
            <button class="add-to-cart-btn" onclick="addToCart('Running Sneakers')">Add to Cart</button>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" alt="Camera" class="product-image">
            <div class="product-title">Vintage Camera</div>
            <div class="product-price">$250.00</div>
            <button class="add-to-cart-btn" onclick="addToCart('Vintage Camera')">Add to Cart</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="toast-message">Item added to cart!</span>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-container-bottom">
        <nav class="liquid-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="shop.html" class="nav-item active"><i class="fa-solid fa-list"></i><span>Category</span></a>
            <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a>
            <a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a>
        </nav>
    </div>

    <script>
        function addToCart(productName) {
            const toast = document.getElementById('toast-container');
            const toastMsg = document.getElementById('toast-message');
            
            toastMsg.innerText = `${productName} cart-e add kora hoyeche!`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
