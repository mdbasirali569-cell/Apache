<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Shop - Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 110px;
            min-height: 100vh;
        }
        .main-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Product Card Styling */
        .product-card {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        .product-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .product-price {
            font-size: 16px;
            color: #38bdf8;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .add-to-cart-btn {
            background: #ffffff;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .add-to-cart-btn:hover {
            background: #f1f5f9;
            transform: translateY(-2px);
        }

        /* Custom Glass Toast Notification Styling */
        #toast-container {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #f8fafc;
            padding: 12px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }
        #toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        #toast-container i {
            color: #38bdf8;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2 style="text-align: center; margin-bottom: 25px;">Featured Products</h2>

        <!-- Product 1 -->
        <div class="product-card">
            <div class="product-title">Wireless Headphones</div>
            <div class="product-price">$99.00</div>
            <button class="add-to-cart-btn" onclick="addToCart('Wireless Headphones')">Add to Cart</button>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <div class="product-title">Smart Watch</div>
            <div class="product-price">$149.00</div>
            <button class="add-to-cart-btn" onclick="addToCart('Smart Watch')">Add to Cart</button>
        </div>
    </div>

    <!-- Toast Notification Element -->
    <div id="toast-container">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="toast-message">Item added to cart!</span>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-container-bottom">
        <nav class="liquid-nav">
            <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a>
            <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a>
            <a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a>
        </nav>
    </div>

    <script>
        function addToCart(productName) {
            // Toast notification call
            const toast = document.getElementById('toast-container');
            const toastMsg = document.getElementById('toast-message');
            
            toastMsg.innerText = `${productName} cart-e add kora hoyeche!`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
