<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apache Shop - Category</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{background:#0f172a;color:#fff;font-family:Segoe UI,sans-serif;margin:0;padding-bottom:110px}.search-container{padding:15px 20px;background:#0b0f19;position:sticky;top:0;z-index:100}.search-box{display:flex;gap:12px;align-items:center;background:#ffffff12;border:1px solid #ffffff26;border-radius:30px;padding:10px 18px}.search-box input{background:transparent;border:0;outline:0;color:#fff;width:100%}.section-title{text-align:center;margin:25px}.products-container{max-width:600px;margin:auto;padding:0 20px}.product-card{background:#fff;color:#0f172a;border-radius:24px;overflow:hidden;margin-bottom:25px;text-align:center;padding-bottom:20px}.product-image{width:100%;height:200px;object-fit:cover}.product-title{font-size:18px;font-weight:700;margin:15px 0 5px}.product-price{color:#ef4444;font-weight:600;margin-bottom:15px}.add-to-cart-btn{background:#1e293b;color:#fff;border:0;padding:12px 30px;border-radius:14px;font-weight:600}#toast-container{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:#111827ee;color:#fff;padding:12px 22px;border-radius:16px;z-index:1000;opacity:0;transition:.3s}#toast-container.show{transform:translateX(-50%) translateY(0);opacity:1}</style></head><body><div class="search-container"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="search" placeholder="Search categories & products..." autocomplete="off"></div></div><h2 class="section-title">Shop Categories</h2><div class="products-container"><div class="product-card" data-name="Running Sneakers"><img class="product-image" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" alt="Running Sneakers"><div class="product-title">Running Sneakers</div><div class="product-price">$120.00</div><button class="add-to-cart-btn" onclick="addToCart('Running Sneakers',120)">Add to Cart</button></div><div class="product-card" data-name="Vintage Camera"><img class="product-image" src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" alt="Vintage Camera"><div class="product-title">Vintage Camera</div><div class="product-price">$250.00</div><button class="add-to-cart-btn" onclick="addToCart('Vintage Camera',250)">Add to Cart</button></div></div><div id="toast-container"><i class="fa-solid fa-bag-shopping"></i> <span id="toast-message"></span></div><div class="nav-container-bottom"><nav class="liquid-nav"><a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a><a href="shop.html" class="nav-item active"><i class="fa-solid fa-list"></i><span>Category</span></a><a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart <small id="cartCount">0</small></span></a><a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a></nav></div><script src="script.js"></script></body></html>
