<!-- Firebase App SDK & Firestore CDN (Compat version for easy HTML integration) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    // Apnar Firebase configuration (Project settings theke pawa)
    const firebaseConfig = {
        apiKey: "AIzaSyDqPVV6VIhZvUH7o6R98lIpf61JtG7B6bU",
        authDomain: "apache-shop.firebaseapp.com",
        projectId: "apache-shop",
        storageBucket: "apache-shop.appspot.com",
        messagingSenderId: "40961890999",
        appId: "1:40961890999:web:cc3e09d9bd47990597cb32",
        measurementId: "G-18W9KDF336"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.addEventListener("DOMContentLoaded", () => {
        loadCheckoutSummary();
    });

    function loadCheckoutSummary() {
        let container = document.getElementById('checkoutItemsList');
        let cart = JSON.parse(localStorage.getItem('apacheCart')) || [];

        if (cart.length === 0) {
            container.innerHTML = '<p style="color: #777;">Cart-e kono product nei.</p>';
            return;
        }

        let html = '<ul style="list-style: none; padding: 0; font-size: 14px;">';
        let total = 0;
        cart.forEach(item => {
            let subTotal = item.price * item.quantity;
            total += subTotal;
            html += `<li style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <span>${item.name} (x${item.quantity})</span>
                        <span>$${subTotal}</span>
                     </li>`;
        });
        html += `</ul><div style="text-align: right; font-weight: bold; margin-top: 10px; font-size: 16px;">Total: $${total}</div>`;
        container.innerHTML = html;
    }

    function togglePaymentFields() {
        let method = document.getElementById('paymentMethod').value;
        let trxContainer = document.getElementById('trxContainer');
        let trxInput = document.getElementById('trxId');

        if (method === 'bkash' || method === 'nagad') {
            trxContainer.style.display = "block";
            trxInput.required = true;
        } else {
            trxContainer.style.display = "none";
            trxInput.required = false;
        }
    }

    // Place Order and Save directly to Firebase Firestore Database
    function placeOrder(event) {
        event.preventDefault();
        let name = document.getElementById('fullName').value;
        let phone = document.getElementById('phoneNumber').value;
        let address = document.getElementById('deliveryAddress').value;
        let payment = document.getElementById('paymentMethod').value;
        let trxId = document.getElementById('trxId').value;

        let cart = JSON.parse(localStorage.getItem('apacheCart')) || [];
        if (cart.length === 0) {
            alert("Apnar cart khali!");
            return;
        }

        let orderData = {
            customerName: name,
            phone: phone,
            address: address,
            paymentMethod: payment,
            trxId: payment === 'cod' ? 'Cash on Delivery' : trxId,
            items: cart,
            orderDate: new Date().toLocaleString()
        };

        // Save data to Firebase Firestore 'orders' collection
        db.collection("orders").add(orderData)
        .then((docRef) => {
            alert("Dhonnobad " + name + "! Apnar order-ti safoltar sathe database-e save hoyeche. Order ID: " + docRef.id);
            localStorage.removeItem('apacheCart');
            window.location.href = "index.html";
        })
        .catch((error) => {
            console.error("Error adding order: ", error);
            alert("Order save korte somossa hocche. Internet connection check korun.");
        });
    }
</script>
