<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache Shop - Checkout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <h2 class="section-title">Checkout</h2>
        
        <div style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); padding: 25px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <h3>Order Summary</h3>
            <div id="checkoutItems" style="margin: 15px 0;"></div>
            <h4 id="checkoutTotal" style="margin-top: 15px;"></h4>
        </div>

        <div style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <h3>Shipping Details</h3>
            <form id="orderForm" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
                <input type="text" id="name" placeholder="Full Name" required style="padding: 12px; border-radius: 8px; border: 1px solid #ccc;">
                <input type="text" id="phone" placeholder="Phone Number" required style="padding: 12px; border-radius: 8px; border: 1px solid #ccc;">
                <textarea id="address" placeholder="Delivery Address" required style="padding: 12px; border-radius: 8px; border: 1px solid #ccc; height: 80px;"></textarea>
                <button type="submit" class="btn" style="padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">Place Order</button>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-container-bottom">
        <nav class="liquid-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a>
            <a href="cart.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a>
            <a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a>
        </nav>
    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
      import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCDm9zVG4V1hzVUHt7o6RK9NzWzVblh5Hs",
        authDomain: "apache-shop.firebaseapp.com",
        projectId: "apache-shop",
        storageBucket: "apache-shop.firebasestorage.app",
        messagingSenderId: "40961890999",
        appId: "1:40961890999:web:5db3dc1001c1e81a97cb32",
        measurementId: "G-ZLH2D7NN4D"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      document.addEventListener("DOMContentLoaded", () => {
          let cart = JSON.parse(localStorage.getItem('apacheCart')) || [];
          let container = document.getElementById('checkoutItems');
          let totalContainer = document.getElementById('checkoutTotal');
          
          if(cart.length === 0) {
              container.innerHTML = "<p>Your cart is empty.</p>";
              return;
          }

          let html = "";
          let totalPrice = 0;
          cart.forEach(item => {
              html += `<p>${item.name} (${item.price} x ${item.quantity})</p>`;
              totalPrice += item.price * item.quantity;
          });
          container.innerHTML = html;
          totalContainer.innerHTML = `Total Price: $${totalPrice}`;

          document.getElementById('orderForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              try {
                  await addDoc(collection(db, "orders"), {
                      customerName: document.getElementById('name').value,
                      phone: document.getElementById('phone').value,
                      address: document.getElementById('address').value,
                      items: cart,
                      total: totalPrice,
                      timestamp: new Date()
                  });
                  alert("Order placed successfully!");
                  localStorage.removeItem('apacheCart');
                  window.location.href = "index.html";
              } catch (err) {
                  console.error("Error adding document: ", err);
                  alert("Order failed! Please try again.");
              }
          });
      });
    </script>
</body>
</html>
