<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apache Shop - Checkout</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><main class="container"><h2 class="section-title">Checkout</h2><div class="cart-card"><h3>Order Summary</h3><div id="checkoutItems"></div><h4 id="checkoutTotal"></h4></div><div class="cart-card checkout-form-card"><h3>Shipping Details</h3><form id="orderForm" class="checkout-form"><input type="text" id="name" placeholder="Full Name" required><input type="tel" id="phone" placeholder="Phone Number" required><textarea id="address" placeholder="Delivery Address" required></textarea><button type="submit" class="checkout-btn">Place Order</button></form></div></main><div class="nav-container-bottom"><nav class="liquid-nav"><a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a><a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a><a href="cart.html" class="nav-item active"><i class="fa-solid fa-cart-shopping"></i><span>Cart <small id="cartCount">0</small></span></a><a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a></nav></div><script src="script.js"></script><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getFirestore,collection,addDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyCDm9zVG4V1hzVUHt7o6RK9NzWzVblh5Hs",authDomain:"apache-shop.firebaseapp.com",projectId:"apache-shop",storageBucket:"apache-shop.firebasestorage.app",messagingSenderId:"40961890999",appId:"1:40961890999:web:5db3dc1001c1e81a97cb32",measurementId:"G-ZLH2D7NN4D"};const app=initializeApp(firebaseConfig),db=getFirestore(app);document.addEventListener("DOMContentLoaded",()=>{const cart=getCart(),box=document.getElementById("checkoutItems"),totalEl=document.getElementById("checkoutTotal");if(!cart.length){box.innerHTML='<div class="empty-cart"><h3>Your cart is empty</h3><a href="shop.html">Continue Shopping</a></div>';document.getElementById("orderForm").style.display="none";return}let total=0;box.innerHTML=cart.map(i=>{const s=Number(i.price)*Number(i.quantity);total+=s;return '<p>'+escapeHtml(i.name)+' × '+i.quantity+' — $'+s.toFixed(2)+'</p>'}).join("");totalEl.textContent="Total Price: $"+total.toFixed(2);document.getElementById("orderForm").addEventListener("submit",async e=>{e.preventDefault();try{await addDoc(collection(db,"orders"),{customerName:document.getElementById("name").value.trim(),phone:document.getElementById("phone").value.trim(),address:document.getElementById("address").value.trim(),items:cart,total:total,timestamp:new Date()});localStorage.removeItem(APACHE_CART_KEY);alert("Order placed successfully!");location.href="index.html"}catch(err){console.error(err);alert("Order failed. Please try again.")}})});</script></body></html>
