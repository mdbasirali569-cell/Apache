<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apache Shop - Checkout</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><main class="container checkout-page"><div class="checkout-head"><a href="cart.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to cart</a><h2 class="section-title">Secure Checkout</h2><div class="checkout-steps"><span class="step active">1. Delivery</span><span>2. Review</span><span>3. Complete</span></div></div><div class="checkout-grid"><section class="cart-card"><h3>Delivery Details</h3><form id="orderForm" class="checkout-form"><label>Full Name<input type="text" id="name" placeholder="Your full name" required></label><label>Phone Number<input type="tel" id="phone" placeholder="01XXXXXXXXX" required></label><label>Delivery Address<textarea id="address" placeholder="House, road, area, city" required></textarea></label><button type="submit" class="checkout-btn">Place Order <i class="fa-solid fa-lock"></i></button></form></section><aside class="cart-card checkout-summary-card"><h3>Order Summary</h3><div id="checkoutItems"></div><div id="checkoutTotal"></div><p class="secure-note"><i class="fa-solid fa-shield-halved"></i> Your order details are securely processed.</p></aside></div></main><div class="nav-container-bottom"><nav class="liquid-nav"><a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a><a href="shop.html" class="nav-item"><i class="fa-solid fa-list"></i><span>Category</span></a><a href="cart.html" class="nav-item active"><i class="fa-solid fa-cart-shopping"></i><span>Cart <small id="cartCount">0</small></span></a><a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a></nav></div><script src="script.js"></script><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";const firebaseConfig={apiKey:"AIzaSyCDm9zVG4V1hzVUHt7o6RK9NzWzVblh5Hs",authDomain:"apache-shop.firebaseapp.com",projectId:"apache-shop",storageBucket:"apache-shop.firebasestorage.app",messagingSenderId:"40961890999",appId:"1:40961890999:web:5db3dc1001c1e81a97cb32",measurementId:"G-ZLH2D7NN4D"};const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);function renderCheckout(){const cart=getCart(),items=document.getElementById("checkoutItems"),totalEl=document.getElementById("checkoutTotal"),form=document.getElementById("orderForm");if(!items)return;if(!cart.length){items.innerHTML='<div class="empty-cart"><h3>Your cart is empty</h3><a href="shop.html">Continue Shopping</a></div>';totalEl.innerHTML="";if(form)form.style.display="none";return}if(form)form.style.display="grid";const t=getCartTotals();items.innerHTML=cart.map(i=>'<div class="checkout-item"><span>'+escapeHtml(i.name)+' × '+i.quantity+'</span><b>$'+(Number(i.price)*Number(i.quantity)).toFixed(2)+'</b></div>').join("");totalEl.innerHTML='<div class="summary-lines"><div><span>Subtotal</span><b>$'+t.subtotal.toFixed(2)+'</b></div>'+(t.discount?'<div class="discount-line"><span>Coupon</span><b>−$'+t.discount.toFixed(2)+'</b></div>':'')+'<div><span>Shipping</span><b>'+(t.shipping===0?"FREE":"$"+t.shipping.toFixed(2))+'</b></div><div class="grand"><span>Total</span><b>$'+t.total.toFixed(2)+'</b></div></div>'}document.addEventListener("DOMContentLoaded",()=>{renderCheckout();onAuthStateChanged(auth,u=>{if(!u){document.getElementById("orderForm")?.querySelector("button")?.setAttribute("disabled","disabled");const n=document.createElement("p");n.className="secure-note";n.innerHTML='<i class="fa-solid fa-user-lock"></i> Please sign in to your account before placing an order. <a href="account.html">Sign in</a>';document.getElementById("orderForm")?.prepend(n)}else{document.getElementById("orderForm")?.querySelector("button")?.removeAttribute("disabled")}});document.getElementById("orderForm")?.addEventListener("submit",async e=>{e.preventDefault();const cart=getCart();if(!cart.length)return;const user=auth.currentUser;if(!user){alert("Please sign in before placing an order.");location.href="account.html";return}const t=getCartTotals();const btn=e.target.querySelector("button");btn.disabled=true;btn.textContent="Placing order...";try{await addDoc(collection(db,"orders"),{uid:user.uid,customerEmail:user.email||"",uid:user.uid,customerEmail:user.email||"",customerName:document.getElementById("name").value.trim(),phone:document.getElementById("phone").value.trim(),address:document.getElementById("address").value.trim(),items:cart,subtotal:t.subtotal,discount:t.discount,shipping:t.shipping,total:t.total,coupon:t.coupon||null,status:"pending",paymentStatus:"unpaid",timestamp:serverTimestamp()});localStorage.removeItem(APACHE_CART_KEY);localStorage.removeItem(APACHE_COUPON_KEY);alert("Order placed successfully!");location.href="index.html"}catch(err){console.error(err);alert("Order failed. Please try again.");btn.disabled=false;btn.textContent="Place Order"}})});</script></body></html>
